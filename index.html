<script>
// Ensure 4 buttons are removed when shop links are clicked

  function hideFourButtons(){

      // Only hide if it's the small round button in header (h-10 w-10)
      if(el.className && el.className.includes('rounded-full') && el.className.includes('h-10')){
        el.style.display='none';
        // Hide parent flex container if it becomes empty
        const parent = el.parentElement;
        if(parent && parent.children.length <= 4){
          let allHidden = true;
          for(let child of parent.children){
            if(child.style.display !== 'none' && child.tagName === 'A') { allHidden = false; }
          }
          // keep logo visible, so don't hide parent if it has other content
        }
      }
    });
  }

  window.addEventListener('hashchange', hideFourButtons);
  setInterval(hideFourButtons, 800);
})();

})();
